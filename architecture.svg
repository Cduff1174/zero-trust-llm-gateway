<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 24px; font-weight: 800; fill: #f8fafc; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; }
    .node-header { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .node-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
    .code-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #cbd5e1; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bg)" rx="16"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>
    <rect width="1200" height="680" fill="url(#grid)"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="67" y="16" class="badge-text" text-anchor="middle">REFERENCE ARCHITECTURE</text>
    <text x="0" y="56" class="title">Zero-Trust LLM Gateway &amp; FinOps DLP Proxy</text>
    <text x="0" y="80" class="subtitle">Ingress Throttling, In-Memory PII Masking, DynamoDB Quota Ledger, &amp; Encrypted KMS Auditing</text>
  </g>

  <!-- AWS Boundary Box -->
  <g transform="translate(320, 150)">
    <rect width="820" height="465" rx="14" fill="#030712" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
    <rect x="20" y="-12" width="220" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="130" y="4" class="node-header" font-size="10.5" fill="#e2e8f0" text-anchor="middle">AWS ZERO-TRUST ENCLAVE</text>
  </g>

  <!-- Connector Lines -->
  <g stroke-width="2" stroke-linecap="round" fill="none">
    <!-- Client to API GW -->
    <path d="M 180 320 L 350 320" stroke="#38bdf8" stroke-dasharray="4 4"/>
    <!-- API GW to Lambda -->
    <path d="M 490 320 L 560 320" stroke="#38bdf8"/>
    <!-- Lambda to DynamoDB -->
    <path d="M 645 250 L 645 210 L 760 210" stroke="#c084fc"/>
    <!-- Lambda to Bedrock -->
    <path d="M 730 320 L 820 320" stroke="#34d399"/>
    <!-- Lambda to CloudWatch -->
    <path d="M 645 390 L 645 470 L 760 470" stroke="#fb7185"/>
    <!-- CloudWatch to KMS -->
    <path d="M 960 470 L 1020 470" stroke="#64748b" stroke-dasharray="3 3"/>
  </g>

  <!-- NODE 1: CLIENT -->
  <g transform="translate(60, 260)" filter="url(#shadow)">
    <rect width="120" height="120" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5"/>
    <!-- Laptop Icon -->
    <rect x="46" y="32" width="28" height="18" rx="2" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="42" y1="52" x2="78" y2="52" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="80" class="node-header" text-anchor="middle">API Client</text>
    <text x="60" y="96" class="node-sub" text-anchor="middle">Bearer / API Key</text>
  </g>

  <!-- NODE 2: API GATEWAY -->
  <g transform="translate(350, 250)" filter="url(#shadow)">
    <rect width="140" height="140" rx="12" fill="url(#card-bg)" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Shield Icon -->
    <polygon points="70,22 86,28 86,42 70,52 54,42 54,28" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="80" class="node-header" text-anchor="middle">API Gateway</text>
    <rect x="20" y="94" width="100" height="18" rx="4" fill="#451a03"/>
    <text x="70" y="106.5" font-family="sans-serif" font-size="9" font-weight="700" fill="#fde68a" text-anchor="middle">5 RPS Burst Limit</text>
    <text x="70" y="124" class="node-sub" font-size="9" text-anchor="middle">Blocks Unauth (403)</text>
  </g>

  <!-- NODE 3: LAMBDA DLP PROXY -->
  <g transform="translate(560, 240)" filter="url(#shadow)">
    <rect width="170" height="160" rx="12" fill="url(#card-bg)" stroke="#f97316" stroke-width="2"/>
    <!-- Lambda Icon -->
    <circle cx="85" cy="40" r="15" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5"/>
    <text x="85" y="46" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#fed7aa" text-anchor="middle">λ</text>
    <text x="85" y="78" class="node-header" text-anchor="middle">AWS Lambda</text>
    <text x="85" y="94" font-family="sans-serif" font-size="10" font-weight="600" fill="#fb923c" text-anchor="middle">Zero-Trust DLP Proxy</text>
    
    <rect x="15" y="106" width="140" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="122" class="code-text" fill="#34d399">✓ Mask SSN / Email</text>
    <text x="25" y="136" class="code-text" fill="#38bdf8">✓ Token Pre-Check</text>
  </g>

  <!-- NODE 4: DYNAMODB -->
  <g transform="translate(760, 160)" filter="url(#shadow)">
    <rect width="190" height="105" rx="12" fill="url(#card-bg)" stroke="#a855f7" stroke-width="1.5"/>
    <!-- DB Icon -->
    <ellipse cx="36" cy="30" rx="14" ry="5" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <path d="M 22 30 v 14 a 14 5 0 0 0 28 0 v -14" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <text x="62" y="32" class="node-header">DynamoDB</text>
    <text x="62" y="47" class="node-sub" fill="#c084fc">FinOps Quota Ledger</text>
    <rect x="15" y="62" width="160" height="30" rx="4" fill="#2e1065"/>
    <text x="22" y="75" class="code-text" fill="#e9d5ff">PK: ApiKeyId</text>
    <text x="22" y="86" class="code-text" fill="#ddd6fe">TTL: 24h Auto-Reset</text>
  </g>

  <!-- NODE 5: AMAZON BEDROCK (NOVA MICRO) -->
  <g transform="translate(820, 260)" filter="url(#shadow)">
    <rect width="200" height="120" rx="12" fill="url(#card-bg)" stroke="#10b981" stroke-width="1.5"/>
    <!-- CPU/AI Brain Icon -->
    <rect x="22" y="22" width="22" height="22" rx="4" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <line x1="28" y1="28" x2="38" y2="38" stroke="#34d399" stroke-width="1.5"/>
    <text x="56" y="32" class="node-header">Amazon Bedrock</text>
    <text x="56" y="47" class="node-sub" fill="#34d399">Nova Micro Serverless</text>
    <rect x="15" y="65" width="170" height="40" rx="4" fill="#064e3b" fill-opacity="0.5"/>
    <text x="24" y="80" class="code-text" fill="#6ee7b7" font-weight="700">✓ Sanitized Inputs Only</text>
    <text x="24" y="94" class="code-text" fill="#a7f3d0">Pay-Per-Token Billing</text>
  </g>

  <!-- NODE 6: CLOUDWATCH LOGS -->
  <g transform="translate(760, 420)" filter="url(#shadow)">
    <rect width="200" height="105" rx="12" fill="url(#card-bg)" stroke="#f43f5e" stroke-width="1.5"/>
    <!-- Log Document Icon -->
    <rect x="22" y="20" width="18" height="24" rx="2" fill="none" stroke="#fb7185" stroke-width="1.5"/>
    <line x1="26" y1="26" x2="36" y2="26" stroke="#fb7185" stroke-width="1.5"/>
    <line x1="26" y1="32" x2="36" y2="32" stroke="#fb7185" stroke-width="1.5"/>
    <text x="50" y="32" class="node-header">CloudWatch Logs</text>
    <text x="50" y="47" class="node-sub" fill="#fb7185">Sanitized Audits</text>
    <rect x="15" y="62" width="170" height="30" rx="4" fill="#4c0519"/>
    <text x="22" y="75" class="code-text" fill="#fecdd3">Immutable Event Hashes</text>
    <text x="22" y="86" class="code-text" fill="#fda4af">Zero Raw PII Stored</text>
  </g>

  <!-- NODE 7: AWS KMS -->
  <g transform="translate(1020, 432)" filter="url(#shadow)">
    <rect width="105" height="80" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <!-- Key Icon -->
    <circle cx="52" cy="30" r="6" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="52" y1="36" x2="52" y2="48" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="52" y1="42" x2="56" y2="42" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="52" y="62" font-family="sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">AWS KMS</text>
    <text x="52" y="72" font-family="sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">CMK Rotated</text>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 640)">
    <text x="0" y="0" class="subtitle">Terraform Managed | Zero Idle Cost (&lt; $2/mo) | AWS Free Tier Eligible</text>
    <text x="1080" y="0" class="badge-text" text-anchor="end">PRODUCTION PORTFOLIO ARCHITECTURE</text>
  </g>
</svg>
